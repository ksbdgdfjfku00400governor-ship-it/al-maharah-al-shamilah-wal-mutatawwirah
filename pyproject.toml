[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acns"
version = "0.1.0"
description = "AI Cognitive Neural System - نظام عصبي معرفي حاسوبي مستوحى من تنظيم الخلايا"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
acns-demo = "acns.demo:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
